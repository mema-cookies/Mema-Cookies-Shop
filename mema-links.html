<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8dce7" />
  <meta name="description" content="كل روابط متجر ميما في مكان واحد — تسوقي وتواصلي وتابعينا." />
  <title>ميما | كل روابطنا</title>
  <style>
    :root{--pink:#e99ab8;--deep:#a94f75;--pale:#fff4f8;--ink:#63384a;--line:#f1cbd9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 12%,#fff 0 5%,transparent 27%),linear-gradient(145deg,#fff7fa,#f8dce7 55%,#fcecf2);display:flex;align-items:center;justify-content:center;padding:28px 16px}
    .page{width:min(100%,440px);text-align:center}
    .card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:30px;padding:34px 24px 25px;box-shadow:0 18px 55px rgba(169,79,117,.13);backdrop-filter:blur(10px)}
    .logo{display:block;width:min(100%,310px);height:auto;max-height:190px;object-fit:contain;margin:0 auto 12px;border-radius:0;filter:drop-shadow(0 5px 10px rgba(169,79,117,.08))}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;letter-spacing:1px;margin:0;color:#a94f75}
    .tagline{font-size:14px;margin:9px 0 25px;color:#9a6a7d}
    .links{display:grid;gap:12px}
    .link{min-height:58px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:11px;padding:14px 18px;border-radius:17px;background:#fff;border:1px solid var(--line);color:#8f4967;font-weight:700;font-size:16px;box-shadow:0 5px 13px rgba(169,79,117,.06);transition:transform .18s,box-shadow .18s,background .18s}
    .link:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(169,79,117,.13);background:#fffafd}
    .link.primary{background:linear-gradient(100deg,#d978a0,#eea9c2);border:0;color:#fff;box-shadow:0 8px 18px rgba(217,120,160,.25)}
    .icon{width:22px;height:22px;display:inline-grid;place-items:center;font-size:19px}
    .footer{font-size:12px;color:#b07b91;margin:22px 0 0}
    .sparkle{position:fixed;color:rgba(196,111,146,.28);font-size:24px;pointer-events:none}
    .s1{top:9%;right:9%}.s2{bottom:12%;left:8%;font-size:30px}.s3{top:42%;left:5%;font-size:17px}
    @media(max-width:380px){.card{padding:28px 18px 22px}h1{font-size:34px}.link{font-size:15px}}
  </style>
</head>
