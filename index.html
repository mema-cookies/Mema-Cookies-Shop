        let cart = {};

        let sliderIntervals = []; 

        function clearAllSliders() {
            sliderIntervals.forEach(interval => clearInterval(interval));
            sliderIntervals = [];
        }

        function renderMenu(items) {
            clearAllSliders(); 
            const container = document.getElementById('menuContent');
            container.innerHTML = "";
            const cats = { cookies: "الكوكيز", pudding: "البودينق", cakes: "الكيكات", areeka: "عريكة كوكيز", boxes: "البوكسات", glow: "✨ لمسات مضيئة" };
            for (let key in cats) {
                const filtered = items.filter(i => i.cat === key);
                if (filtered.length > 0) {
                    container.innerHTML += `<div class="section-title">${cats[key]}</div>`;
                    let grid = '<div class="menu-grid">';
                    filtered.forEach(item => {
                        let imgsHtml = item.imgs.map((img, idx) => `<img src="${img}" class="${idx===0?'active':''}">`).join('');
                        let extrasHtml = '';
                        if (item.extras) {
                            extrasHtml = `<div class="extras-container">`;
                            item.extras.forEach(ex => {
                                const exId = `ex_${item.id}_${ex.name.replace(/\s/g, '')}`;
                                const isSelected = cart[exId]?.qty > 0;
                                extrasHtml += `
                                <div class="extra-interactive-item ${isSelected ? 'selected' : ''}" id="card-${exId}">
                                    <span class="extra-name">${ex.name} (+${ex.price})</span>
                                    <div class="extra-ctrl">
                                        <button class="btn-extra" onclick="changeQty('${exId}', '${ex.name}', ${ex.price}, 1, '${item.id}')">+</button>
                                        <span class="extra-qty" id="mq-${exId}">${cart[exId]?.qty || 0}</span>
                                        <button class="btn-extra" style="background:#ddd; color:#666" onclick="changeQty('${exId}', '${ex.name}', ${ex.price}, -1, '${item.id}')">-</button>
                                    </div>
                                </div>`;
                                extrasHtml += `<span id="warn-${exId}" class="warning-text" style="display:${isSelected && ex.hasWarning ? 'block' : 'none'}">* هذا الورق غير قابل للأكل</span>`;
                                extrasHtml += `<input type="text" id="note-${exId}" class="note-box" style="display:${isSelected && ex.hasNote ? 'block' : 'none'}" oninput="updateNote('${exId}', this.value)" placeholder="${ex.noteLabel || 'اكتب ملاحظتك هنا...'}" value="${cart[exId]?.note || ''}">`;
                            });
                            extrasHtml += `</div>`;
                        }
                        grid += `
                        <div class="product-card" data-product-id="${item.id}">
                            <div class="image-container" onclick="openProductPage('${item.id}')">${imgsHtml}</div>
                            <div class="product-info" onclick="openProductPage('${item.id}')">
                                <h3>${item.name}</h3>
                                <div class="product-desc">${item.desc}</div>
                                <span class="price-text">${item.price} ريال</span>
                            </div>
                            ${extrasHtml}
                            <div class="main-controls">
                                <button class="btn-main" onclick="changeQty('${item.id}', '${item.name}', ${item.price}, 1)">+</button>
                                <span class="main-qty" id="mq-${item.id}">${cart[item.id]?.qty || 0}</span>
                                <button class="btn-main" style="background:#eee; color:#333" onclick="changeQty('${item.id}', '${item.name}', ${item.price}, -1)">-</button>
                            </div>
                        </div>`;
                    });
                    container.innerHTML += grid + '</div>';
                }
            }
            startSliders();
        }

        function openProductPage(productId) {
            const item = products.find(p => p.id === productId);
            document.getElementById('pageHeaderTitle').innerText = item.name;
            let imgsHtml = item.imgs.map((img, idx) => `<img src="${img}" class="${idx===0?'active':''}" id="pimg-${idx}">`).join('');
            
            let extrasHtml = '';
            if (item.extras) {
                extrasHtml = `<div class="page-extras"><h3 style="font-size:16px; color:var(--main-brown); margin-bottom:15px;">الاضافات</h3>`;
                item.extras.forEach(ex => {
                    const exId = `ex_${item.id}_${ex.name.replace(/\s/g, '')}`;
                    const isSelected = cart[exId]?.qty > 0;
                    extrasHtml += `
                    <div class="extra-interactive-item ${isSelected ? 'selected' : ''}" id="pcard-${exId}" style="margin-bottom:10px; padding:12px;">
                        <span style="font-size:13px; font-weight:bold">${ex.name} (+${ex.price} ريال)</span>
                        <div style="display:flex; align-items:center; gap:10px">
                            <button class="btn-extra" onclick="changeQty('${exId}', '${ex.name}', ${ex.price}, 1, '${item.id}')">+</button>
                            <span id="q-${exId}" style="font-weight:bold; color:var(--main-pink)">${cart[exId]?.qty || 0}</span>
                            <button class="btn-extra" style="background:#ddd; color:#666" onclick="changeQty('${exId}', '${ex.name}', ${ex.price}, -1, '${item.id}')">-</button>
                        </div>
                    </div>`;
                    extrasHtml += `<span id="pwarn-${exId}" class="warning-text" style="display:${isSelected && ex.hasWarning ? 'block' : 'none'}; text-align:right; margin-top:-5px; margin-bottom:5px;">* هذا الورق غير قابل للأكل</span>`;
                    extrasHtml += `<input type="text" id="pnote-${exId}" class="note-box" style="display:${isSelected && ex.hasNote ? 'block' : 'none'}" oninput="updateNote('${exId}', this.value)" placeholder="${ex.noteLabel || 'الملاحظة...'}" value="${cart[exId]?.note || ''}">`;
                });
                extrasHtml += `</div>`;
            }

            document.getElementById('pageContent').innerHTML = `
                <div class="page-slider">
                    <button class="slider-arrow arrow-left" onclick="prevImg(${item.imgs.length})"><i class="fas fa-chevron-right"></i></button>
                    ${imgsHtml}
                    <button class="slider-arrow arrow-right" onclick="nextImg(${item.imgs.length})"><i class="fas fa-chevron-left"></i></button>
                </div>
                <div class="details-section" style="padding:20px; text-align:center">
                    <h2 style="color:var(--main-brown); margin:0; font-size:22px;">${item.name}</h2>

                    <span style="font-size:28px; font-weight:900; color:var(--main-pink);">${item.price} ريال</span>
                </div>
                

                ${extrasHtml}
                <div class="page-action-container">
                    <div class="btn-add-product">
                        <span>التحكم بالطلب</span>
                        <div style="display:flex; align-items:center; gap:20px">
                            <button class="btn-main" onclick="event.stopPropagation(); changeQty('${item.id}', '${item.name}', ${item.price}, 1)" style="background:white; color:var(--main-brown);">+</button>
                            <span id="q-${item.id}" style="font-weight:800; font-size:24px">${cart[item.id]?.qty || 0}</span>
                            <button class="btn-main" onclick="event.stopPropagation(); changeQty('${item.id}', '${item.name}', ${item.price}, -1)" style="background:white; color:var(--main-brown);">-</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('productPage').style.display = 'block';
            currentImgIdx = 0;
        }

        let currentImgIdx = 0;
        function nextImg(total) {
            const el = document.getElementById(`pimg-${currentImgIdx}`);
            if(el) el.classList.remove('active');
            currentImgIdx = (currentImgIdx + 1) % total;
            const nextEl = document.getElementById(`pimg-${currentImgIdx}`);
            if(nextEl) nextEl.classList.add('active');
        }
        function prevImg(total) {
            const el = document.getElementById(`pimg-${currentImgIdx}`);
            if(el) el.classList.remove('active');
            currentImgIdx = (currentImgIdx - 1 + total) % total;
            const prevEl = document.getElementById(`pimg-${currentImgIdx}`);
            if(prevEl) prevEl.classList.add('active');
        }

        function closeProductPage() {
            document.getElementById('productPage').style.display = 'none';
            document.getElementById('mainView').style.display = 'block';
            renderMenu(products.filter(p => {
                const activeBtn = document.querySelector('.cat-btn.active');
                if(!activeBtn || activeBtn.innerText.includes('الكل')) return true;
                return p.cat === activeBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
            }));
        }

        function changeQty(id, name, price, delta, parentId = null) { 
            if (!cart[id]) cart[id] = { name: name, price: price, qty: 0, note: "", parentId: parentId }; 
            cart[id].qty += delta; 
            if (cart[id].qty <= 0) {
                if(!parentId) { for (let key in cart) { if(cart[key].parentId === id) delete cart[key]; } }
                delete cart[id];
            }
            
            ['q-'+id, 'mq-'+id].forEach(eid => {
                const el = document.getElementById(eid);
                if(el) el.innerText = cart[id]?.qty || 0;
            });
            
            const card = document.getElementById('card-'+id);
            if(card) {
                if(cart[id]?.qty > 0) card.classList.add('selected');
                else card.classList.remove('selected');
            }
            
            const pcard = document.getElementById('pcard-'+id);
            if(pcard) {
                if(cart[id]?.qty > 0) pcard.classList.add('selected');
                else pcard.classList.remove('selected');
            }

            ['note-'+id, 'pnote-'+id, 'warn-'+id, 'pwarn-'+id].forEach(eid => {
                const el = document.getElementById(eid);
                if(el) {
                    const linkedProduct = products.find(p => p.id === (parentId || id)) || {};
                    const baseExtra = (linkedProduct.extras || []).find(e => `ex_${linkedProduct.id}_${e.name.replace(/\s/g, '')}` === id) || {};
                    if(eid.includes('warn') && !baseExtra.hasWarning) el.style.display = 'none';
                    else if(eid.includes('note') && !baseExtra.hasNote) el.style.display = 'none';
                    else el.style.display = (cart[id]?.qty > 0) ? 'block' : 'none';
                }
            });
            
            updateCartUI();
            if(document.getElementById('reviewModal').style.display === 'block') updateReviewOnly();
        }

        function updateNote(id, val) { 
            if(cart[id]) cart[id].note = val; 
            ['note-'+id, 'pnote-'+id].forEach(eid => {
                const el = document.getElementById(eid);
                if(el && el.value !== val) el.value = val;
            });
        }
        
        function updateCartUI() { 
            let count = 0, total = 0; 
            for (let id in cart) { 
                if(!cart[id].parentId) {
                    count += cart[id].qty; 
                }
                total += (cart[id].qty * cart[id].price); 
            } 
            document.getElementById('cartBar').style.display = count > 0 ? 'flex' : 'none'; 
            document.getElementById('itemsCount').innerText = count; 
            document.getElementById('totalPrice').innerText = total + " ريال"; 
        }

        function startSliders() { 
            document.querySelectorAll('.product-card').forEach(card => { 
                const imgs = card.querySelectorAll('.image-container img'); 
                if (imgs.length > 1) { 
                    const interval = setInterval(() => { 
                        let activeImg = card.querySelector('.image-container img.active');
                        if (activeImg) {
                            activeImg.classList.remove('active');
                            let nextImg = activeImg.nextElementSibling || card.querySelector('.image-container img');
                            nextImg.classList.add('active');
                        }
                    }, 4000); 
                    sliderIntervals.push(interval); 
                } 
            }); 
        }

        function applyCoupon() {
            const input = document.getElementById('couponInput').value.trim();
            const msg = document.getElementById('couponMsg');
            
            // تم التعديل: تصفية وتحسين التحقق من الكوبون لضمان عدم رفضه بسبب الرموز التعبيرية أو المسافات
if (
    input === "ورود تاج راسي وحياتي" ||
    input === "راتب"
) {
    isDiscountApplied = true;

    if (input === "راتب") {
        discountRate = 0.05;
        msg.innerText = "✅ تم تطبيق خصم 5٪";
    } else {
        discountRate = 0.02;
        msg.innerText = "✅ تم تطبيق خصم 2٪";
    }

    msg.style.color = "green";
}
            } else {
                isDiscountApplied = false;
                discountRate = 0;
                msg.innerText = "❌ كود غير صحيح أو انتهت صلاحيته";
                msg.style.color = "red";
            }
            updateReviewOnly();
        }

        // تم التعديل: تفعيل أحداث اللمس (Pointer Events) فور فتح النافذة
        function openReview() {
            updateReviewOnly();
            const modal = document.getElementById('reviewModal');
            modal.style.display = 'block';
            modal.style.pointerEvents = 'auto'; 
        }

        // تم التعديل: حظر أحداث اللمس للنافذة فور إغلاقها كي لا تحجب واجهة المتجر
        function closeReview() { 
            const modal = document.getElementById('reviewModal');
            modal.style.display = 'none'; 
            modal.style.pointerEvents = 'none'; 
        }

        function updateReviewOnly() {
            const list = document.getElementById('reviewItems');
            list.innerHTML = ""; let subtotal = 0;
            let hasItems = false;

            for (let id in cart) {
                let item = cart[id];
                if(!item.parentId) {
                    hasItems = true;
                    let productBaseTotal = item.qty * item.price;
                    let extrasDetails = "";
                    let extrasTotal = 0;
                    for(let exId in cart) { 
                        if(cart[exId].parentId === id) {
                            let exCost = cart[exId].qty * cart[exId].price;
                            extrasTotal += exCost;
                            extrasDetails += `
                            <div class="extra-row-invoice">
                                <span>+ ${cart[exId].name} (${cart[exId].qty}) ${cart[exId].note ? '<br><small>📝 '+cart[exId].note+'</small>' : ''}</span>
                                <div class="cart-item-ctrl">
                                    <button class="btn-cart-qty" onclick="changeQty('${exId}', '${cart[exId].name}', ${cart[exId].price}, 1, '${id}')">+</button>
                                    <span style="font-weight:bold; margin:0 5px">${exCost} ر.س</span>
                                    <button class="btn-cart-qty" onclick="changeQty('${exId}', '${cart[exId].name}', ${cart[exId].price}, -1, '${id}')">-</button>
                                </div>
                            </div>`;
                        }
                    }
                    list.innerHTML += `
                    <div class="cart-item-row">
                        <div class="cart-item-header">
                            <b style="color:var(--main-brown); font-size:16px;">${item.name}</b>
                            <div class="cart-item-ctrl">
                                <button class="btn-cart-qty" onclick="changeQty('${id}', '${item.name}', ${item.price}, 1)">+</button>
                                <span style="font-weight:bold; width:20px; text-align:center">${item.qty}</span>
                                <button class="btn-cart-qty" onclick="changeQty('${id}', '${item.name}', ${item.price}, -1)">-</button>
                                <span style="margin-right:10px; font-weight:900; color:var(--main-pink)">${productBaseTotal} ر.س</span>
                            </div>
                        </div>
                        ${extrasDetails}
                    </div>`;
                    subtotal += (productBaseTotal + extrasTotal);
                }
            }

            if(!hasItems) {
                list.innerHTML = `<div style="text-align:center; padding:20px; color:#999;">سلة المشتريات فارغة حالياً 🛒</div>`;
            }

            let finalTotal = subtotal;
            if(isDiscountApplied && subtotal > 0) {
                let discountAmount = subtotal * discountRate;
                finalTotal = subtotal - discountAmount;
                document.getElementById('subtotalRow').style.display = "block";
                document.getElementById('discountRow').style.display = "block";
                document.getElementById('modalSubtotal').innerText = subtotal.toFixed(2);
                document.getElementById('modalDiscountVal').innerText = discountAmount.toFixed(2);
                document.getElementById('discountPercentText').innerText = (discountRate * 100).toString();
            } else {
                document.getElementById('subtotalRow').style.display = "none";
                document.getElementById('discountRow').style.display = "none";
            }

            document.getElementById('modalTotal').innerText = finalTotal.toFixed(2);
        }

        function sendWhatsApp() { 
            let msg = "أهلاً كوكيز ميما، طلب جديد 🍪:\n\n"; 
            let subtotal = 0; 
            let hasItems = false;
            for (let id in cart) { 
                let item = cart[id];
                if(!item.parentId) {
                    hasItems = true;
                    let baseTotal = item.qty * item.price;
                    msg += `*${item.name}*\n`;
                    msg += `العدد: ${item.qty} | السعر: ${baseTotal} ريال\n`;
                    let extrasMsg = "";
                    let extrasTotal = 0;
                    for(let exId in cart) { 
                        if(cart[exId].parentId === id) {
                            let exCost = cart[exId].qty * cart[exId].price;
                            extrasTotal += exCost;
                            extrasMsg += `  + ${cart[exId].name} (${cart[exId].qty}) [${exCost} ريال] ${cart[exId].note ? '\n     ملاحظة: '+cart[exId].note : ''}\n`;
                        }
                    }
                    if(extrasMsg) msg += extrasMsg;
                    msg += `\n`;
                    subtotal += (baseTotal + extrasTotal);
                }
            } 

            if(!hasItems) {
                alert('الرجاء إضافة منتجات أولاً قبل الإرسال!');
                return;
            }

            if(isDiscountApplied) {
                let discountVal = subtotal * discountRate;
                let final = subtotal - discountVal;
                msg += `--------------------------\n`;
                msg += `💰 الإجمالي قبل الخصم: ${subtotal.toFixed(2)} ريال\n`;
                msg += `🎟️ كود الخصم (${discountRate * 100}%): -${discountVal.toFixed(2)} ريال\n`;
                msg += `✨ *الإجمالي النهائي للطلب: ${final.toFixed(2)} ريال*`;
            } else {
                msg += `✨ *الإجمالي النهائي للطلب: ${subtotal.toFixed(2)} ريال*`;
            }

            window.open(`https://wa.me/966502509910?text=${encodeURIComponent(msg)}`); 
        }

        function filterMenu(cat, btn) { 
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active'); 
            renderMenu(cat === 'all' ? products : products.filter(p => p.cat === cat)); 
        }
        
        renderMenu(products);
    </script>
</body>
</html>
